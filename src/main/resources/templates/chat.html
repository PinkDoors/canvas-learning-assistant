<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LLM Assistant</title>

    <!-- graph library -->
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>

        body{
            font-family: Arial;
            margin:20px;
        }

        #graphContainer{
            height:400px;
            border:1px solid #ccc;
            margin-bottom:20px;
        }

        textarea{
            width:500px;
        }

        pre{
            background:#f5f5f5;
            padding:10px;
        }

    </style>
</head>

<body>

<h3>Course Knowledge Graph</h3>

<div id="graphContainer"></div>

<hr>

<h3>LLM Assistant</h3>

<textarea id="input" rows="4"></textarea><br/>
<button onclick="send()">Send</button>

<pre id="output"></pre>

<script th:inline="javascript">

    /* graph from backend */

    const graph = /*[[${graph}]]*/ [];


    /* convert your format -> vis nodes + edges */

    const nodeMap = new Map();
    const nodes = [];
    const edges = [];

    function getNodeId(label){

        if(!nodeMap.has(label)){
            const id = nodeMap.size + 1;
            nodeMap.set(label,id);

            nodes.push({
                id:id,
                label:label
            });
        }

        return nodeMap.get(label);
    }

    graph.forEach(rel => {

        const fromId = getNodeId(rel.firstNode);
        const toId = getNodeId(rel.secondNode);

        edges.push({
            from:fromId,
            to:toId,
            title:rel.edge,
            arrows:"to"
        });

    });


    /* render graph */

    const container = document.getElementById("graphContainer");

    const data = {
        nodes:new vis.DataSet(nodes),
        edges:new vis.DataSet(edges)
    };

    const options = {
        nodes:{
            shape:"dot",
            size:18,
            font:{size:16}
        },
        edges:{
            smooth:true
        },
        physics:{
            stabilization:false
        }
    };

    const network = new vis.Network(container,data,options);


    /* optional: click node to ask chat */

    network.on("click",function(params){

        if(params.nodes.length > 0){

            const nodeId = params.nodes[0];
            const node = nodes.find(n => n.id === nodeId);

            input.value = "Explain concept: " + node.label;

        }

    });


    /* existing chat */

    function send(){

        fetch("/api/chat",{
            method:"POST",
            headers:{ "Content-Type":"application/json"},
            body:JSON.stringify({ message:input.value })
        })
            .then(r=>r.json())
            .then(d=>output.textContent = d.response);

    }

</script>

</body>
</html>
