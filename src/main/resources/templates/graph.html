<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM + Graph</title>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        textarea {
            width: 500px;
        }

        pre {
            background: #f5f5f5;
            padding: 10px;
        }

        #graphContainer {
            height: 600px;
            border: 1px solid #ccc;
            margin-top: 20px;
        }

        /* Loader */
        .loader {
            width: 16px;
            height: 16px;
            border: 3px solid #ccc;
            border-top: 3px solid #28a745;
            border-radius: 50%;
            display: inline-block;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<h3>LLM Assistant</h3>

<textarea id="input" rows="4"></textarea><br/>

<button id="sendBtn" onclick="send()">Send</button>
<span id="chatLoader" class="loader" style="display:none;"></span>

<label style="margin-left:10px; font-size:14px;">
    <input type="checkbox" id="useGraph">
    Use graph
</label>

<pre id="output"></pre>

<hr>

<h3>Course Knowledge Graph</h3>

<form th:action="@{/lti/generate-quiz}" method="post">
    <button type="submit" style="
        margin-bottom: 15px;
        padding: 10px 16px;
        font-size: 14px;
        background-color: #2c7be5;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;">
        Update my knowledge
    </button>
</form>

<!-- Sync button -->
<button id="syncBtn" onclick="syncResults()" style="
    margin-bottom: 15px;
    margin-left: 10px;
    padding: 10px 16px;
    font-size: 14px;
    background-color: #28a745;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;">
    Check my quizzes
</button>

<span id="syncLoader" class="loader" style="display:none;"></span>

<div id="graphContainer"></div>

<script th:inline="javascript">

    const input = document.getElementById("input");
    const output = document.getElementById("output");

    function send() {
        const loader = document.getElementById("chatLoader");
        const btn = document.getElementById("sendBtn");
        const useGraph = document.getElementById("useGraph").checked;

        loader.style.display = "inline-block";
        btn.disabled = true;

        const endpoint = useGraph ? "/lti/chat-graph" : "/lti/chat";

        fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: input.value
            })
        })
            .then(r => {
                if (!r.ok) throw new Error("Request failed");
                return r.json();
            })
            .then(d => {
                output.textContent = d.response;
            })
            .catch(e => {
                output.textContent = "Error: " + e;
            })
            .finally(() => {
                loader.style.display = "none";
                btn.disabled = false;
            });
    }

    function syncResults() {
        const loader = document.getElementById("syncLoader");
        const btn = document.getElementById("syncBtn");

        loader.style.display = "inline-block";
        btn.disabled = true;

        fetch("/lti/sync-results", { method: "POST" })
            .then(res => {
                if (!res.ok) throw new Error("Request failed");
                return res.text();
            })
            .then(() => {
                loadGraph();
            })
            .catch(err => {
                alert("Error: " + err.message);
            })
            .finally(() => {
                loader.style.display = "none";
                btn.disabled = false;
            });
    }

    const nodeMap = new Map();
    const nodes = [];
    const edges = [];

    function getNodeId(label) {
        if (!nodeMap.has(label)) {
            const id = nodeMap.size + 1;
            nodeMap.set(label, id);

            nodes.push({
                id,
                label,
                shape: "dot",
                size: 20,
                font: { multi: "html", size: 16, face: "Arial" }
            });
        }
        return nodeMap.get(label);
    }

    function renderGraph(graph) {

        nodeMap.clear();
        nodes.length = 0;
        edges.length = 0;

        graph.forEach(rel => {
            const fromId = getNodeId(rel.firstNode.name);
            const toId = getNodeId(rel.secondNode.name);

            edges.push({
                id: edges.length + 1,
                from: fromId,
                to: toId,
                label: "",
                labelState: false,
                edgeLabelText: rel.edge,
                arrows: "to",
                font: { align: "horizontal" }
            });
        });

        const container = document.getElementById("graphContainer");

        const data = {
            nodes: new vis.DataSet(nodes),
            edges: new vis.DataSet(edges)
        };

        const network = new vis.Network(container, data, {
            layout: {
                hierarchical: {
                    enabled: true,
                    levelSeparation: 120,
                    nodeSpacing: 100,
                    treeSpacing: 200,
                    direction: "UD",
                    sortMethod: "directed"
                }
            },
            edges: {
                smooth: false,
                font: { align: "horizontal" }
            },
            physics: { enabled: false },
            nodes: {
                shape: "dot",
                size: 20,
                font: { multi: "html", size: 16, face: "Arial" }
            }
        });

        network.on("click", function(params) {

            const edgesDS = data.edges;

            if (params.edges.length > 0) {
                const edgeId = params.edges[0];
                const edge = edgesDS.get(edgeId);

                const newState = !edge.labelState;

                edgesDS.update({
                    id: edgeId,
                    labelState: newState,
                    label: newState ? edge.edgeLabelText : " "
                });

                return;
            }

            if (params.nodes.length > 0) {
                const node = nodes.find(n => n.id === params.nodes[0]);
                input.value = "Explain concept: " + node.label;
                return;
            }

            edgesDS.update(
                edgesDS.get().map(e => ({
                    id: e.id,
                    labelState: false,
                    label: " "
                }))
            );
        });
    }

    function loadGraph() {
        fetch("/lti/graph-data")
            .then(r => r.json())
            .then(renderGraph)
            .catch(err => {
                console.error(err);
                document.getElementById("graphContainer").innerText =
                    "Error loading graph";
            });
    }

    window.addEventListener("load", loadGraph);

</script>

</body>
</html>
