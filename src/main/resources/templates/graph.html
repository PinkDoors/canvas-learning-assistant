<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LLM + Graph</title>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        textarea {
            width: 500px;
        }

        pre {
            background: #f5f5f5;
            padding: 10px;
        }

        #graphContainer {
            height: 600px;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<!-- CHAT -->
<h3>LLM Assistant</h3>

<textarea id="input" rows="4"></textarea><br/>
<button onclick="send()">Send</button>

<pre id="output"></pre>

<hr>

<!-- ORIGINAL CONTENT -->
<h3>Course Knowledge Graph</h3>

<form th:action="@{/lti/generate-quiz}" method="post">
    <input type="hidden" name="course_id" th:value="${course_id}" />
    <input type="hidden" name="user_id" th:value="${user_id}" />
    <input type="hidden" name="access_token" th:value="${access_token}" />

    <button type="submit" style="
        margin-bottom: 15px;
        padding: 10px 16px;
        font-size: 14px;
        background-color: #2c7be5;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;">
        Update my knowledge
    </button>
</form>

<form th:action="@{/lti/sync-results}" method="post">
    <input type="hidden" name="course_id" th:value="${course_id}" />
    <input type="hidden" name="user_id" th:value="${user_id}" />
    <input type="hidden" name="access_token" th:value="${access_token}" />

    <button type="submit" style="
        margin-bottom: 15px;
        margin-left: 10px;
        padding: 10px 16px;
        font-size: 14px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;">
        Check my quizzes
    </button>
</form>

<div id="graphContainer"></div>

<script th:inline="javascript">

    // CHAT
    const input = document.getElementById("input");
    const output = document.getElementById("output");

    function send(){
        const userId = /*[[${user_id}]]*/ 0;   // Thymeleaf will inject user_id here

        fetch("/lti/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: input.value,
                user_id: userId
            })
        })
            .then(r => r.json())
            .then(d => output.textContent = d.response)
            .catch(e => output.textContent = "Error: " + e);
    }

    // GRAPH
    const graph = /*[[${graph}]]*/ [];

    const nodeMap = new Map();
    const nodes = [];
    const edges = [];

    function getNodeId(label) {
        if (!nodeMap.has(label)) {
            const id = nodeMap.size + 1;
            nodeMap.set(label, id);

            nodes.push({
                id: id,
                label: label,
                shape: "dot",
                size: 20,
                font: { multi: "html", size: 16, face: "Arial" }
            });
        }
        return nodeMap.get(label);
    }

    graph.forEach(rel => {
        const fromId = getNodeId(rel.firstNode.name);
        const toId = getNodeId(rel.secondNode.name);

        edges.push({
            from: fromId,
            to: toId,
            label: "",
            edgeLabelText: rel.edge,
            arrows: "to",
            font: { align: "horizontal" }
        });
    });

    const container = document.getElementById("graphContainer");

    const data = {
        nodes: new vis.DataSet(nodes),
        edges: new vis.DataSet(edges)
    };

    const options = {
        layout: {
            hierarchical: {
                enabled: true,
                levelSeparation: 120,
                nodeSpacing: 100,
                treeSpacing: 200,
                direction: "UD",
                sortMethod: "directed"
            }
        },
        edges: {
            smooth: { enabled: false },
            font: { align: "horizontal" }
        },
        physics: {
            enabled: false
        },
        nodes: {
            shape: "dot",
            size: 20,
            font: { multi: "html", size: 16, face: "Arial" }
        }
    };

    const network = new vis.Network(container, data, options);

    network.on("selectEdge", function(params) {
        const edgesDS = data.edges;
        const edgeId = params.edges[0];
        const edge = edgesDS.get(edgeId);
        edgesDS.update({ id: edgeId, label: edge.edgeLabelText });
    });

    network.on("deselectEdge", function(params) {
        const edgesDS = data.edges;
        params.previousSelection.edges.forEach(edgeId => {
            edgesDS.update({ id: edgeId, label: "" });
        });
    });

    // OPTIONAL: node -> chat
    network.on("click", function(params){
        if(params.nodes.length > 0){
            const nodeId = params.nodes[0];
            const node = nodes.find(n => n.id === nodeId);
            input.value = "Explain concept: " + node.label;
        }
    });

</script>

</body>
</html>
