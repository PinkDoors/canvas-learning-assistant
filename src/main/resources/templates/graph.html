<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>LLM + Graph</title>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        textarea {
            width: 500px;
        }

        pre {
            background: #f5f5f5;
            padding: 10px;
        }

        #graphContainer {
            height: 600px;
            border: 1px solid #ccc;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h3>LLM Assistant</h3>

<textarea id="input" rows="4"></textarea><br/>
<button onclick="send()">Send</button>

<pre id="output"></pre>

<hr>

<h3>Course Knowledge Graph</h3>

<form th:action="@{/lti/generate-quiz}" method="post">
    <button type="submit" style="
        margin-bottom: 15px;
        padding: 10px 16px;
        font-size: 14px;
        background-color: #2c7be5;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;">
        Update my knowledge
    </button>
</form>

<form th:action="@{/lti/sync-results}" method="post">
    <button type="submit" style="
        margin-bottom: 15px;
        margin-left: 10px;
        padding: 10px 16px;
        font-size: 14px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;">
        Check my quizzes
    </button>
</form>

<div id="graphContainer"></div>

<script th:inline="javascript">

    // =========================
    // CHAT
    // =========================
    const input = document.getElementById("input");
    const output = document.getElementById("output");

    function send() {
        const userId = /*[[${user_id}]]*/ 0;

        fetch("/lti/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                message: input.value,
                user_id: userId
            })
        })
            .then(r => r.json())
            .then(d => output.textContent = d.response)
            .catch(e => output.textContent = "Error: " + e);
    }

    // =========================
    // GRAPH STATE
    // =========================
    const nodeMap = new Map();
    const nodes = [];
    const edges = [];

    function getNodeId(label) {
        if (!nodeMap.has(label)) {
            const id = nodeMap.size + 1;
            nodeMap.set(label, id);

            nodes.push({
                id,
                label,
                shape: "dot",
                size: 20,
                font: { multi: "html", size: 16, face: "Arial" }
            });
        }
        return nodeMap.get(label);
    }

    function renderGraph(graph) {

        nodeMap.clear();
        nodes.length = 0;
        edges.length = 0;

        graph.forEach(rel => {
            const fromId = getNodeId(rel.firstNode.name);
            const toId = getNodeId(rel.secondNode.name);

            edges.push({
                id: edges.length + 1,
                from: fromId,
                to: toId,

                label: "",               // never used for truth
                labelState: false,       // 🔥 STATE SOURCE OF TRUTH

                edgeLabelText: rel.edge,

                arrows: "to",
                font: { align: "horizontal" }
            });
        });

        const container = document.getElementById("graphContainer");

        const data = {
            nodes: new vis.DataSet(nodes),
            edges: new vis.DataSet(edges)
        };

        const network = new vis.Network(container, data, {
            layout: {
                hierarchical: {
                    enabled: true,
                    levelSeparation: 120,
                    nodeSpacing: 100,
                    treeSpacing: 200,
                    direction: "UD",
                    sortMethod: "directed"
                }
            },
            edges: {
                smooth: { enabled: false },
                font: { align: "horizontal" }
            },
            physics: { enabled: false },
            nodes: {
                shape: "dot",
                size: 20,
                font: { multi: "html", size: 16, face: "Arial" }
            }
        });

        // =========================
        // CLICK HANDLER (ROBUST)
        // =========================
        network.on("click", function(params) {

            const edgesDS = data.edges;

            console.log("CLICK:", params);

            // =========================
            // EDGE CLICK → TOGGLE
            // =========================
            if (params.edges.length > 0) {

                const edgeId = params.edges[0];
                const edge = edgesDS.get(edgeId);

                console.log("EDGE:", edge);

                const newState = !edge.labelState;

                console.log("Toggle labelState:", edge.labelState, "→", newState);

                edgesDS.update({
                    id: edgeId,
                    labelState: newState,
                    label: newState ? edge.edgeLabelText : ' '
                });

                return;
            }

            // =========================
            // NODE CLICK
            // =========================
            if (params.nodes.length > 0) {

                const node = nodes.find(n => n.id === params.nodes[0]);

                console.log("NODE:", node);

                input.value = "Explain concept: " + node.label;

                return;
            }

            // =========================
            // EMPTY SPACE → CLEAR ALL
            // =========================
            console.log("EMPTY CLICK → clearing all");

            edgesDS.update(
                edgesDS.get().map(e => ({
                    id: e.id,
                    labelState: false,
                    label: ' '
                }))
            );
        });
    }

    // =========================
    // LOAD GRAPH
    // =========================
    function loadGraph() {
        fetch("/lti/graph-data")
            .then(r => r.json())
            .then(renderGraph)
            .catch(err => {
                console.error(err);
                document.getElementById("graphContainer").innerText =
                    "Error loading graph";
            });
    }

    window.addEventListener("load", loadGraph);

</script>

</body>
</html>
